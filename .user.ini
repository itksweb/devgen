; =====================================================================
; DEVGENIUS ACADEMY - DIRECTADMIN & CPANEL PHP-FPM CONFIGURATION
; Standard per-directory PHP configuration file (.user.ini)
; Automatically loaded by PHP-FPM, LiteSpeed, and FastCGI on shared hosts.
; Prevents 500 Internal Server Errors caused by php_value in .htaccess.
; =====================================================================

upload_max_filesize = 25M
post_max_size = 30M
memory_limit = 128M
max_execution_time = 300
max_input_time = 300
session.gc_maxlifetime = 14400
